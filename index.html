<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Translator</title>
<link rel="icon" href="/icon.ico">
<style>
:root{
  --font:"Segoe UI Variable Text","Segoe UI","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --bg:#f3f4fa; --panel:#fff; --panel2:#eceef7; --text:#161a2b; --muted:#6b7190; --line:#e0e3f0;
  --accent:#6c5ce7; --accent2:#00a8cc; --soft:rgba(108,92,231,.10);
  --g1:rgba(108,92,231,.13); --g2:rgba(0,184,217,.12); --shadow:0 8px 28px rgba(30,35,80,.08);
  --ok:#1fb578; --bad:#e5484d;
}
[data-theme=dark]{
  --bg:#0c0e19; --panel:#151929; --panel2:#1c2136; --text:#e8ebf7; --muted:#8a91b4; --line:#262b46;
  --accent:#8b7bff; --accent2:#3ed3f0; --soft:rgba(139,123,255,.15);
  --g1:rgba(139,123,255,.20); --g2:rgba(62,211,240,.12); --shadow:0 8px 28px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0}
button:focus{outline:none}
button:focus-visible{box-shadow:0 0 0 2px var(--accent)}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--font);display:flex;flex-direction:column;
  overflow:hidden;transition:background .4s,color .4s}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(620px 320px at 12% -6%,var(--g1),transparent 70%),
             radial-gradient(520px 300px at 96% 0,var(--g2),transparent 70%)}
header{position:relative;display:flex;align-items:center;gap:18px;padding:16px 24px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;
  background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 6px 18px var(--soft)}
.brand b{display:block;font-size:16px;line-height:1.1}.brand small{color:var(--muted);font-size:12px}
.pill{display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:99px;background:var(--panel);
  border:1px solid var(--line);color:var(--muted);font-size:13px;transition:.3s}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);transition:.3s}
.pill.ready .dot{background:var(--ok)}.pill.live .dot{background:var(--bad);animation:blink 1.2s infinite}
.pill.busy .dot{background:var(--accent);animation:blink .7s infinite}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--panel);
  color:var(--text);cursor:pointer;display:grid;place-items:center;transition:.25s}
.icon-btn:hover{transform:translateY(-1px);border-color:var(--accent)}
.icon-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sun{display:none}[data-theme=light] .sun{display:block}[data-theme=light] .moon{display:none}
.seg{position:relative;display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:4px}
.seg button{position:relative;z-index:1;background:none;border:0;color:var(--muted);padding:7px 16px;border-radius:9px;
  font:600 14px var(--font);cursor:pointer;transition:color .25s}
.seg button.active{color:var(--text)}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:0;width:0;background:var(--panel);border-radius:9px;
  box-shadow:0 2px 10px rgba(0,0,0,.18);transition:transform .32s cubic-bezier(.4,.1,.2,1),width .32s cubic-bezier(.4,.1,.2,1),background .4s}
.view{display:none;position:relative;flex:1;min-height:0;flex-direction:column;gap:14px;padding:0 24px 22px}
.view.active{display:flex;animation:fade .4s}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);transition:background .4s,border-color .4s}
.bar{display:flex;align-items:center;gap:14px;padding:14px 16px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:13px;padding:10px 16px;
  font:600 14px var(--font);cursor:pointer;transition:.25s}
.btn:hover:not(:disabled){transform:translateY(-1px);border-color:var(--accent)}
.btn.primary{border:0;color:#fff;padding:11px 24px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 6px 20px var(--soft)}
.btn.primary.on{background:linear-gradient(135deg,#ff5d6c,#ff8a5b);animation:pulse 1.8s infinite}
.btn:disabled{opacity:.45;cursor:not-allowed}
.spacer{flex:1}
.meter{position:relative;width:150px;height:8px;border-radius:99px;background:var(--panel2)}
.fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--ok),var(--accent2));transition:width .09s linear}
.mark{position:absolute;top:-3px;bottom:-3px;width:2px;border-radius:2px;background:var(--text);opacity:.6;transition:left .15s}
.drawer{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.drawer.open{grid-template-rows:1fr}.drawer>div{overflow:hidden}
.opts{display:flex;gap:22px;align-items:center;flex-wrap:wrap;padding:4px 18px 16px;color:var(--muted);font-size:14px}
.opts label{display:flex;align-items:center;gap:10px;cursor:pointer}
input[type=range]{accent-color:var(--accent);width:160px}
.sw{appearance:none;width:38px;height:22px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);
  position:relative;cursor:pointer;transition:.25s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:.25s}
.sw:checked{background:var(--accent);border-color:var(--accent)}.sw:checked::after{transform:translateX(16px);background:#fff}
.chat{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:4px 4px 8px;scroll-behavior:smooth}
.chat::-webkit-scrollbar,textarea::-webkit-scrollbar,.out::-webkit-scrollbar{width:8px}
.chat::-webkit-scrollbar-thumb,textarea::-webkit-scrollbar-thumb,.out::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.msg,.live,.err{position:relative;border-radius:18px;padding:14px 18px;animation:pop .38s cubic-bezier(.2,.8,.2,1)}
.msg{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}
.src{display:flex;gap:10px;align-items:baseline;color:var(--muted);font-size:14px}
.tr{margin-top:6px;font-size:20px;font-weight:650;padding-right:70px}
.badge{font-size:11px;font-weight:800;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--accent);flex:none}
.badge.en{background:rgba(0,184,217,.15);color:var(--accent2)}
.copy{position:absolute;right:14px;top:14px;border:0;background:var(--panel2);color:var(--muted);border-radius:9px;
  padding:5px 10px;font:600 12px var(--font);cursor:pointer;opacity:0;transition:.2s}
.msg:hover .copy,.panel:hover .copy{opacity:1}.copy:hover{color:var(--text)}
.live{border:1.5px dashed var(--accent);background:var(--soft);display:flex;gap:12px;align-items:center;color:var(--text)}
.live .lt{font-size:16px;font-style:italic}
.dots{display:inline-flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:bounce 1.1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.msg.stream .tr::after{content:"▍";margin-left:2px;color:var(--accent);animation:blink 1s infinite}
.err{background:rgba(229,72,77,.12);border:1px solid rgba(229,72,77,.4);color:var(--bad);font-size:14px}
.empty{margin:auto;text-align:center;color:var(--muted);max-width:340px;animation:fade .5s}
.empty .big{font-size:44px;margin-bottom:8px;filter:saturate(.8)}
.tgrid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.tgrid{grid-template-columns:1fr}}
.panel{position:relative;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.panel h4{padding:14px 18px 0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
textarea,.out{flex:1;min-height:0;background:transparent;border:0;outline:0;resize:none;color:var(--text);
  font:17px/1.6 var(--font);padding:10px 18px 16px;overflow:auto;white-space:pre-wrap}
.out.empty-o{color:var(--muted)}
.panel .copy{top:10px}
.sel{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font:inherit;cursor:pointer}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);max-width:80vw;padding:11px 18px;border-radius:14px;
  background:var(--panel);border:1px solid var(--accent);box-shadow:var(--shadow);font-size:14px;opacity:0;pointer-events:none;transition:.35s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:.35}}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-5px);opacity:1}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,93,108,.5)}70%{box-shadow:0 0 0 14px rgba(255,93,108,0)}100%{box-shadow:0 0 0 0 rgba(255,93,108,0)}}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo">あA</div><div><b>Live Translator</b><small>日本語 ⇄ English</small></div></div>
  <div class="seg" id="tabs"><button data-v="live" class="active">Voice</button><button data-v="text">Text</button></div>
  <div class="pill" id="pill"><span class="dot"></span><span id="pillTxt">Starting…</span></div>
  <button class="icon-btn" id="theme" title="Toggle theme">
    <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</header>

<section class="view active" id="v-live">
  <div class="card">
    <div class="bar">
      <button class="btn primary" id="go" disabled>Start</button>
      <button class="btn" id="clr">Clear</button>
      <div class="seg" id="mode"><button data-v="auto" class="active">Auto</button><button data-v="ja">日本語</button><button data-v="en">English</button></div>
      <span class="spacer"></span>
      <div class="meter" title="Microphone level"><div class="fill" id="fill"></div><div class="mark" id="mark"></div></div>
      <button class="icon-btn" id="cfg" title="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
    <div class="drawer" id="drawer"><div><div class="opts">
      <label>Volume threshold <input type="range" id="thr" min="0.001" max="0.05" step="0.001" value="0.005"><span id="thrV">0.005</span></label>
      <label><input class="sw" type="checkbox" id="partials" checked>Live text while speaking</label>
      <label><input class="sw" type="checkbox" id="streamtr">Show translation as it’s generated</label>
      <label>Save transcript on Stop <select class="sel" id="transcript"><option value="off">Off</option><option value="txt">TXT</option><option value="docx">Word (.docx)</option></select></label>
      <button class="btn" id="openDir" style="padding:6px 12px">Open folder</button>
    </div></div></div>
  </div>
  <div class="chat" id="chat"><div class="empty" id="empty"><div class="big">🎙️</div>Press “Start” and speak — the recognized text and its translation will appear here.</div></div>
</section>

<section class="view" id="v-text">
  <div class="card"><div class="bar">
    <button class="btn primary" id="tGo" disabled>Translate</button>
    <button class="btn" id="tClr">Clear</button>
    <div class="seg" id="dir"><button data-v="auto" class="active">Auto</button><button data-v="ja-en">日本語 → EN</button><button data-v="en-ja">EN → 日本語</button></div>
    <span class="spacer"></span><span id="tStat" style="color:var(--muted);font-size:14px">Ctrl+Enter to translate</span>
  </div></div>
  <div class="tgrid">
    <div class="card panel"><h4>Source text</h4><textarea id="tIn" placeholder="Paste or type text…"></textarea></div>
    <div class="card panel"><h4>Translation</h4><div class="out empty-o" id="tOut">The translation will appear here</div><button class="copy" id="tCopy">Copy</button></div>
  </div>
</section>

<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const st={connected:false,ready:false,listening:false,busy:false,queue:0,server:'Starting…'};
const api=(c,b={})=>fetch('/api/'+c,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})
  .then(r=>r.json()).catch(()=>({error:'No connection to the app'}));
const root=document.documentElement;
function setTheme(t){root.dataset.theme=t;try{localStorage.setItem('theme',t)}catch(e){}}
let saved=null;try{saved=localStorage.getItem('theme')}catch(e){}
setTheme(saved||'dark');
$('#theme').onclick=()=>setTheme(root.dataset.theme==='dark'?'light':'dark');

/* segmented switches with a sliding thumb */
function makeSeg(id,cb){
  const el=$('#'+id),th=document.createElement('span');th.className='thumb';el.prepend(th);
  const btns=[...el.querySelectorAll('button')];
  const place=()=>{const b=el.querySelector('.active');if(!b)return;th.style.width=b.offsetWidth+'px';th.style.transform=`translateX(${b.offsetLeft}px)`};
  const set=v=>{btns.forEach(b=>b.classList.toggle('active',b.dataset.v===v));place()};
  btns.forEach(b=>b.onclick=()=>{set(b.dataset.v);cb&&cb(b.dataset.v)});
  addEventListener('resize',place);requestAnimationFrame(place);
  return {set,place};
}
const tabs=makeSeg('tabs',v=>{$$('.view').forEach(x=>x.classList.toggle('active',x.id==='v-'+v))});
const mode=makeSeg('mode',v=>api('settings',{mode:v}));
let tdir='auto';const dir=makeSeg('dir',v=>tdir=v);
$('#tabs').addEventListener('click',()=>setTimeout(()=>{mode.place();dir.place()},30));

/* state and status */
function render(){
  const pill=$('#pill');let txt,cls='';
  if(!st.connected){txt='Disconnected'}
  else if(!st.ready){txt=st.server}
  else if(st.listening){txt=st.busy?('Translating…'+(st.queue?` (queued: ${st.queue})`:'')):'Listening…';cls=st.busy?'busy':'live'}
  else{txt='Ready';cls='ready'}
  pill.className='pill '+cls;$('#pillTxt').textContent=txt;
  const go=$('#go');go.disabled=!(st.ready&&st.connected);go.classList.toggle('on',st.listening);go.textContent=st.listening?'Stop':'Start';
  if(!tPending)$('#tGo').disabled=!(st.ready&&st.connected);
}
$('#go').onclick=()=>{st.listening=!st.listening;api('listen',{on:st.listening});if(!st.listening)clearLive();render()};

/* chat */
const chat=$('#chat');let live=null;
const near=()=>chat.scrollHeight-chat.scrollTop-chat.clientHeight<180;
function hideEmpty(){const e=$('#empty');if(e)e.style.display='none'}
function add(el){hideEmpty();const n=near();chat.insertBefore(el,live&&live.isConnected?live:null);if(n)chat.scrollTo({top:chat.scrollHeight})}
function flash(b,t='Copied ✓'){const o=b.textContent;b.textContent=t;setTimeout(()=>b.textContent=o,1200)}
function makeMsg(src,orig,tr){
  const m=document.createElement('div');m.className='msg';
  m.innerHTML='<div class="src"><span class="badge"></span><span class="o"></span></div><div class="tr"></div><button class="copy">Copy</button>';
  const b=m.querySelector('.badge');b.textContent=src==='Japanese'?'JP':'EN';b.classList.toggle('en',src!=='Japanese');
  m.querySelector('.o').textContent=orig;m.querySelector('.tr').textContent=tr;
  m.querySelector('.copy').onclick=e=>{navigator.clipboard.writeText(m.querySelector('.tr').textContent);flash(e.target)};
  return m;
}
const addMsg=(s,o,t)=>add(makeMsg(s,o,t));
let pend=null;  /* card whose translation is filled in as it is generated */
function showPending(src,orig,tr){
  if(!pend){clearLive();pend=makeMsg(src,orig,tr);pend.classList.add('stream');add(pend)}
  else{pend.querySelector('.tr').textContent=tr}
  if(near())chat.scrollTo({top:chat.scrollHeight});
}
function addErr(t){const e=document.createElement('div');e.className='err';e.textContent=t;add(e)}
function setLive(t){
  if(!live){live=document.createElement('div');live.className='live';live.innerHTML='<span class="dots"><i></i><i></i><i></i></span><span class="lt"></span>'}
  live.querySelector('.lt').textContent=t;
  if(!live.isConnected){hideEmpty();chat.appendChild(live)}
  if(near())chat.scrollTo({top:chat.scrollHeight});
}
function clearLive(){if(live&&live.isConnected)live.remove()}
$('#clr').onclick=()=>{$$('.msg,.err').forEach(x=>x.remove());pend=null;clearLive();$('#empty').style.display=''};

/* settings */
$('#cfg').onclick=()=>$('#drawer').classList.toggle('open');
const setMark=v=>$('#mark').style.left=(Math.min(v,.05)/.05*100)+'%';
let tmr;$('#thr').oninput=e=>{const v=+e.target.value;$('#thrV').textContent=v.toFixed(3);setMark(v);clearTimeout(tmr);tmr=setTimeout(()=>api('settings',{threshold:v}),80)};
$('#partials').onchange=e=>api('settings',{partials:e.target.checked});
$('#transcript').onchange=e=>api('settings',{transcript:e.target.value});
$('#openDir').onclick=()=>api('open_folder');
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),5000)}
$('#streamtr').onchange=e=>api('settings',{stream_tr:e.target.checked});
setMark(.005);

/* "Text" tab */
let tPending=false,tLabel='';
async function doTranslate(){
  const text=$('#tIn').value.trim();if(!text||tPending||!st.ready)return;
  tPending=true;$('#tGo').disabled=true;$('#tStat').textContent='Translating…';
  const r=await api('translate',{text,direction:tdir});
  if(r.error){tPending=false;$('#tGo').disabled=false;$('#tStat').textContent=r.error;return}
  tLabel=r.direction;$('#tStat').textContent='Translating: '+tLabel+'…';
}
function tDone(text,ok){
  tPending=false;$('#tGo').disabled=false;
  const o=$('#tOut');o.textContent=text;o.classList.toggle('empty-o',!ok);
  $('#tStat').textContent=ok?'Done: '+tLabel:'Error';
}
$('#tGo').onclick=doTranslate;
$('#tIn').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();doTranslate()}});
$('#tClr').onclick=()=>{$('#tIn').value='';const o=$('#tOut');o.textContent='The translation will appear here';o.classList.add('empty-o');$('#tStat').textContent='Ctrl+Enter to translate'};
$('#tCopy').onclick=e=>{const o=$('#tOut');if(!o.classList.contains('empty-o')){navigator.clipboard.writeText(o.textContent);flash(e.target)}};

/* events from Python (SSE) */
function handle(m){
  const d=m.data;
  switch(m.type){
    case 'init':Object.assign(st,{ready:d.ready,server:d.status,listening:d.listening});
      mode.set(d.mode);$('#thr').value=d.threshold;$('#thrV').textContent=(+d.threshold).toFixed(3);setMark(d.threshold);
      $('#partials').checked=d.partials;$('#transcript').value=d.transcript;$('#streamtr').checked=d.stream_tr;break;
    case 'status':st.server=d;break;
    case 'ready':st.ready=true;break;
    case 'busy':st.busy=true;st.queue=d;break;
    case 'done':st.busy=false;st.queue=d;break;
    case 'queue':st.queue=d;break;
    case 'live':if(st.listening)setLive(d);break;
    case 'live_clear':clearLive();break;
    case 'tr_live':showPending(d[0],d[1],d[2]);break;
    case 'pair':clearLive();
      if(pend){const m=pend;pend=null;m.classList.remove('stream');m.querySelector('.o').textContent=d[1];m.querySelector('.tr').textContent=d[2]}
      else addMsg(d[0],d[1],d[2]);break;
    case 'error':st.busy=false;if(pend){pend.remove();pend=null}addErr(d);break;
    case 'text_partial':{const o=$('#tOut');o.textContent=d;o.classList.remove('empty-o')}break;
    case 'text_result':tDone(d,true);break;
    case 'text_error':tDone('Error: '+d,false);break;
    case 'saved':toast('Transcript saved: '+d.split(/[\\/]/).slice(-2).join('/'));break;
    case 'notice':toast(d);break;
    case 'level':$('#fill').style.width=Math.min(d/.05,1)*100+'%';return;
  }
  render();
}
let es;
addEventListener('pagehide',()=>{if(es)es.close()});  /* tell the app right away that the window was closed */
function connect(){
  es=new EventSource('/events');
  es.onopen=()=>{st.connected=true;render()};
  es.onmessage=e=>handle(JSON.parse(e.data));
  es.onerror=()=>{st.connected=false;render()};
}
connect();render();
</script>
</body>
</html>
